<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Appointments | EasyMeet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">📅 EasyMeet</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li class="student-only" style="display: none;"><a href="booking.html">Book Slot</a></li>
      <li class="student-only" style="display: none;"><a href="history.html" class="active-link">My Appointments</a></li>
      <li class="faculty-only" style="display: none;"><a href="admin.html">Dashboard</a></li>
      <li><a href="login.html" class="btn-login">Login</a></li>
      <li><button id="darkModeBtn" class="dark-mode-btn" aria-label="Toggle dark mode"></button></li>
    </ul>
  </nav>

  <main class="page-content">
    <h2>My Appointments</h2>
    <p>Search and manage all your booked appointments.</p>

    <div class="history-toolbar">
      <span id="totalCount" class="total-badge">0 Appointment(s)</span>
      <a href="booking.html" class="btn btn-primary">+ Book New</a>
    </div>

    <div class="search-filter-bar">
      <input type="text" id="historySearch" class="input-field search-input" placeholder="🔍 Search by slot, purpose, faculty..." oninput="renderAllHistory()" />
      <select id="historyStatusFilter" class="filter-select" onchange="renderAllHistory()">
        <option value="all">All Status</option>
        <option value="confirmed">✅ Confirmed</option>
        <option value="cancelled">❌ Cancelled</option>
      </select>
    </div>

    <div id="historyContainer"></div>

  </main>

  <script src="auth.js"></script>
  <script src="slots.js"></script>
  <script src="booking.js"></script>
  <script src="history.js"></script>
  <script src="ui.js"></script>
  <script src="darkmode.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      requireLogin();
      renderAllHistory();
    });
  </script>
</body>
</html>
