<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking Confirmed | EasyMeet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">📅 EasyMeet</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li class="student-only" style="display: none;"><a href="booking.html">Book Slot</a></li>
      <li class="student-only" style="display: none;"><a href="history.html">My Appointments</a></li>
      <li class="faculty-only" style="display: none;"><a href="admin.html">Dashboard</a></li>
      <li><a href="login.html" class="btn-login">Login</a></li>
      <li><button id="darkModeBtn" class="dark-mode-btn" aria-label="Toggle dark mode"></button></li>
    </ul>
  </nav>

  <main class="confirm-wrapper">
    <div class="confirm-card">
      <div class="confirm-icon">✅</div>
      <h2>Booking Confirmed!</h2>
      <p class="confirm-subtitle">Your appointment has been successfully booked.</p>

      <div class="confirm-details" id="confirmDetails">
        <p style="color:#7a6655;">Loading your booking details...</p>
      </div>

      <div class="confirm-actions">
        <a href="booking.html" class="btn btn-primary">📋 Book Another</a>
        <a href="history.html" class="btn btn-secondary">📁 My Appointments</a>
        <a href="index.html" class="btn btn-outline-dark">🏠 Home</a>
      </div>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="ui.js"></script>
  <script src="darkmode.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      requireLogin();
      const container = document.getElementById("confirmDetails");
      if (!container) return;
      const booking = JSON.parse(localStorage.getItem("lastBooking"));
      if (!booking) {
        container.innerHTML = `<p style="color:#b94040;text-align:center;padding:20px;">⚠️ No booking found. Please <a href="booking.html" style="color:#c8813a;">book an appointment</a> first.</p>`;
        return;
      }
      const priorityColors = {
        low:    { bg: "#e8f5e9", color: "#2e7d32", label: "🟢 Low"    },
        medium: { bg: "#fff8e1", color: "#f57f17", label: "🟡 Medium" },
        urgent: { bg: "#fdecea", color: "#b94040", label: "🔴 Urgent" }
      };
      const p = priorityColors[booking.priority] || priorityColors.medium;
      container.innerHTML = `
        <div class="detail-row"><span class="detail-label">🪪 Booking ID</span><span class="detail-value">${booking.id}</span></div>
        <div class="detail-row"><span class="detail-label">👤 Name</span><span class="detail-value">${booking.name}</span></div>
        <div class="detail-row"><span class="detail-label">🎓 Roll No</span><span class="detail-value">${booking.rollNo || "N/A"}</span></div>
        <div class="detail-row"><span class="detail-label">📧 Email</span><span class="detail-value">${booking.email}</span></div>
        <div class="detail-row"><span class="detail-label">👨‍🏫 Faculty</span><span class="detail-value">${booking.facultyName || "N/A"}</span></div>
        <div class="detail-row"><span class="detail-label">🏛️ Department</span><span class="detail-value">${booking.facultyDept || "N/A"}</span></div>
        <div class="detail-row"><span class="detail-label">📅 Date</span><span class="detail-value">${booking.date || "N/A"}</span></div>
        <div class="detail-row"><span class="detail-label">🕐 Time Slot</span><span class="detail-value">${booking.slotLabel}</span></div>
        <div class="detail-row"><span class="detail-label">⏱️ Duration</span><span class="detail-value">${booking.duration || "30min"}</span></div>
        <div class="detail-row"><span class="detail-label">⚡ Priority</span><span class="detail-value"><span style="background:${p.bg};color:${p.color};padding:3px 10px;border-radius:20px;font-weight:700;font-size:0.85rem;">${p.label}</span></span></div>
        <div class="detail-row"><span class="detail-label">📝 Purpose</span><span class="detail-value">${booking.purpose}</span></div>
        <div class="detail-row"><span class="detail-label">✅ Status</span><span class="detail-value status-confirmed">Confirmed</span></div>
      `;
    });
  </script>
</body>
</html>
